<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Fraud Detection AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="logo-icon">🛡️</div>

        <h1>Fraud Detection AI</h1>

        <p>Enter your credentials to access the security portal</p>

        {% if error %}
        <div class="error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success">
            ✅ {{ success }}
        </div>
        {% endif %}

        <form action="/login" method="POST">

            <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
            autocomplete="email">

            <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password">

            <button type="submit">
                Log In
            </button>

        </form>

        <div class="bottom-text">
            First time logging in or don't have an account?
            <br>
            <a href="/register">Register New Account</a>
        </div>

    </div>

</div>

</body>

</html>
