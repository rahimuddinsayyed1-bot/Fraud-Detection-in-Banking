<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Fraud Detection AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-page">

<div class="login-box">

    <div class="logo-icon">👤</div>

    <h1>Create Account</h1>

    <p>Register as a new user to access fraud analytics</p>

    {% if error %}
    <div class="error">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="POST">

        <input
        type="text"
        name="name"
        placeholder="Full Name"
        required>

        <input
        type="email"
        name="email"
        placeholder="Email Address"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <input
        type="password"
        name="confirm"
        placeholder="Confirm Password"
        required>

        <button type="submit">
            Create Account & Log In
        </button>

    </form>

    <div class="bottom-text">
        Already registered?
        <a href="/login">Log In Here</a>
    </div>

</div>

</div>

</body>

</html>
